<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Football Challenge 3D</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { overflow:hidden; background:#000; font-family:'Segoe UI',sans-serif; }
  #game { width:100vw; height:100vh; display:block; }
  #hud {
    position:fixed; top:15px; left:15px; right:15px; z-index:10;
    display:flex; justify-content:space-between;
    color:#0ff; font-size:20px; text-shadow:0 0 10px #0ff; pointer-events:none;
  }
  #powerBar {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    width:300px; height:20px; background:rgba(0,0,0,0.6);
    border:2px solid #0ff; border-radius:10px; overflow:hidden; z-index:10;
  }
  #powerFill { height:100%; width:0%; background:linear-gradient(90deg,#0f0,#ff0,#f00); }
  #overlay {
    position:fixed; inset:0; background:rgba(0,0,0,0.85);
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    z-index:100; color:#fff; text-align:center;
  }
  #overlay h1 { font-size:48px; color:#0ff; text-shadow:0 0 20px #0ff; margin-bottom:20px; }
  #overlay p { font-size:18px; margin-bottom:30px; color:#aaa; max-width:600px; }
  #overlay button {
    padding:15px 50px; font-size:20px; background:linear-gradient(90deg,#0ff,#f0f);
    border:none; border-radius:30px; color:#000; font-weight:bold; cursor:pointer;
    margin:5px;
  }
  .hidden { display:none !important; }
  #aim {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    width:40px; height:40px; border:3px solid #ff0; border-radius:50%;
    pointer-events:none; z-index:5; display:none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div>⚽ GOALS: <span id="goals">0</span></div>
  <div>🎯 SHOTS: <span id="shots">0</span></div>
  <div>⏱ <span id="timer">60</span>s</div>
</div>
<div id="powerBar"><div id="powerFill"></div></div>
<div id="aim"></div>
<div id="overlay">
  <h1>FOOTBALL CHALLENGE 3D</h1>
  <p>Sichqoncha bilan nishonga oling, bosib ushlab turing — kuch to'ldiriladi, qo'yib yuboring — tepasiz. 60 soniyada nechta gol ursangiz!</p>
  <button id="startBtn">START MATCH</button>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a1020);
scene.fog = new THREE.Fog(0x0a1020, 40, 120);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 500);
camera.position.set(0, 5, 18);
camera.lookAt(0, 2, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(10, 20, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left = -20;
sun.shadow.camera.right = 20;
sun.shadow.camera.top = 20;
sun.shadow.camera.bottom = -20;
scene.add(sun);

// stadium lights
[[-15,8,-5],[15,8,-5]].forEach(([x,y,z]) => {
  const light = new THREE.PointLight(0x00ffff, 3, 40);
  light.position.set(x,y,z);
  scene.add(light);
});

// ground (pitch)
const pitch = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 80),
  new THREE.MeshStandardMaterial({ color:0x1a5c1a, roughness:0.9 })
);
pitch.rotation.x = -Math.PI/2;
pitch.position.z = -10;
pitch.receiveShadow = true;
scene.add(pitch);

// pitch lines
const lineMat = new THREE.MeshBasicMaterial({ color:0xffffff });
for (let i = 0; i < 10; i++) {
  const line = new THREE.Mesh(new THREE.PlaneGeometry(0.1, 80), lineMat);
  line.rotation.x = -Math.PI/2;
  line.position.set(-28 + i*6.2, 0.01, -10);
  scene.add(line);
}

// GOAL
const goalGroup = new THREE.Group();
const postMat = new THREE.MeshStandardMaterial({ color:0xffffff, metalness:0.8, roughness:0.2 });
const postGeo = new THREE.CylinderGeometry(0.12, 0.12, 5, 12);
const leftPost = new THREE.Mesh(postGeo, postMat); leftPost.position.set(-4, 2.5, 0);
const rightPost = new THREE.Mesh(postGeo, postMat); rightPost.position.set(4, 2.5, 0);
const crossbar = new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,8,12), postMat);
crossbar.rotation.z = Math.PI/2; crossbar.position.set(0, 5, 0);
goalGroup.add(leftPost, rightPost, crossbar);
// net
const netMat = new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.15, side:THREE.DoubleSide, wireframe:true });
const netBack = new THREE.Mesh(new THREE.PlaneGeometry(8, 5), netMat);
netBack.position.set(0, 2.5, -2);
goalGroup.add(netBack);
goalGroup.position.set(0, 0, -8);
scene.add(goalGroup);

// GOALKEEPER
const keeper = new THREE.Group();
const kBody = new THREE.Mesh(new THREE.BoxGeometry(1.2, 2, 0.6),
  new THREE.MeshStandardMaterial({ color:0xffaa00 }));
kBody.position.y = 1; kBody.castShadow = true;
keeper.add(kBody);
const kHead = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16,16),
  new THREE.MeshStandardMaterial({ color:0xffccaa }));
kHead.position.y = 2.3; kHead.castShadow = true;
keeper.add(kHead);
keeper.position.set(0, 0, -7);
scene.add(keeper);
const keeperState = { x: 0, dir: 1, speed: 0.04 };

// BALL
const ball = new THREE.Mesh(
  new THREE.SphereGeometry(0.4, 24, 24),
  new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.3 })
);
ball.position.set(0, 0.4, 6);
ball.castShadow = true;
scene.add(ball);
const ballPhys = { vel: new THREE.Vector3(), active:false, time:0 };

// aim reticle
const reticle = new THREE.Mesh(
  new THREE.RingGeometry(0.3, 0.5, 16),
  new THREE.MeshBasicMaterial({ color:0xff0, side:THREE.DoubleSide })
);
reticle.rotation.x = -Math.PI/2;
reticle.position.set(0, 0.05, -8);
scene.add(reticle);

// STATE
const state = {
  running: false,
  goals: 0,
  shots: 0,
  time: 60,
  charging: false,
  power: 0,
  aimX: 0,
  aimY: 0,
};

// INPUT
const powerFill = document.getElementById('powerFill');
addEventListener('mousedown', e => {
  if (!state.running || ballPhys.active) return;
  state.charging = true;
  state.power = 0;
});
addEventListener('mouseup', e => {
  if (!state.running || ballPhys.active || !state.charging) return;
  kick();
});
addEventListener('mousemove', e => {
  if (!state.running) return;
  const nx = (e.clientX/innerWidth) * 2 - 1;
  const ny = -((e.clientY/innerHeight) * 2 - 1);
  state.aimX = nx * 6;
  state.aimY = Math.max(0.5, ny * 4);
  reticle.position.set(state.aimX, 0.05, -8 + state.aimY*0.2);
});

// touch
addEventListener('touchstart', e => {
  if (!state.running || ballPhys.active) return;
  state.charging = true;
  state.power = 0;
  const t = e.touches[0];
  state.aimX = ((t.clientX/innerWidth)*2-1) * 6;
  state.aimY = Math.max(0.5, ((t.clientY/innerHeight)*2-1) * -4);
  reticle.position.set(state.aimX, 0.05, -8 + state.aimY*0.2);
});
addEventListener('touchend', e => {
  if (state.charging && !ballPhys.active) kick();
});

function kick() {
  state.charging = false;
  ballPhys.active = true;
  ballPhys.time = 0;
  const power = state.power / 100;
  const dir = new THREE.Vector3(
    state.aimX * 0.1,
    Math.max(0.6, state.aimY * 0.15),
    -1
  ).normalize();
  const speed = 0.4 + power * 0.8;
  ballPhys.vel.copy(dir).multiplyScalar(speed);
  state.shots++;
  document.getElementById('shots').textContent = state.shots;
  powerFill.style.width = '0%';
}

function resetBall() {
  ball.position.set(0, 0.4, 6);
  ballPhys.vel.set(0,0,0);
  ballPhys.active = false;
  ballPhys.time = 0;
}

function gameLoop() {
  requestAnimationFrame(gameLoop);
  const dt = Math.min(0.05, 0.016);

  if (state.running) {
    if (state.charging) {
      state.power = Math.min(100, state.power + 2.5);
      powerFill.style.width = state.power + '%';
    }

    // keeper AI
    keeperState.x += keeperState.dir * keeperState.speed;
    if (keeperState.x > 2.5) { keeperState.x = 2.5; keeperState.dir = -1; }
    if (keeperState.x < -2.5) { keeperState.x = -2.5; keeperState.dir = 1; }
    keeper.position.x = keeperState.x;
    // if ball active, keeper chases ball
    if (ballPhys.active) {
      const chase = ball.position.x;
      keeper.position.x += (chase - keeper.position.x) * 0.05;
      keeper.position.x = Math.max(-3.5, Math.min(3.5, keeper.position.x));
    }

    // ball physics
    if (ballPhys.active) {
      ballPhys.vel.y -= 0.02;
      ball.position.add(ballPhys.vel);
      ball.rotation.x += 0.1;
      ballPhys.time += dt;

      // goal detection
      if (ball.position.z < -8 && ball.position.z > -10 &&
          Math.abs(ball.position.x) < 4 && ball.position.y < 5 && ball.position.y > 0) {
        // check keeper block
        if (Math.abs(ball.position.x - keeper.position.x) < 0.8 && ball.position.y < 2.5) {
          // blocked
        } else {
          state.goals++;
          document.getElementById('goals').textContent = state.goals;
          resetBall();
        }
      }

      // miss / out of bounds
      if (ballPhys.time > 2 || ball.position.z < -15 || Math.abs(ball.position.x) > 15) {
        resetBall();
      }
    }

    state.time -= dt;
    document.getElementById('timer').textContent = Math.max(0, Math.floor(state.time));
    if (state.time <= 0) endGame();
  }

  renderer.render(scene, camera);
}
gameLoop();

function endGame() {
  state.running = false;
  const overlay = document.getElementById('overlay');
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <h1>TIME UP!</h1>
    <p>Gollar: ${state.goals} / ${state.shots} tepish | Aniqlik: ${state.shots>0 ? Math.round(state.goals/state.shots*100) : 0}%</p>
    <button id="restartBtn">QAYTA O'YNASH</button>
  `;
  document.getElementById('restartBtn').addEventListener('click', ()=>location.reload());
}

document.getElementById('startBtn').addEventListener('click', () => {
  document.getElementById('overlay').classList.add('hidden');
  state.running = true;
  state.time = 60;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
